name: Documentation CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: docs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main-source:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository's develop branch
        env:
          VALID_SOURCE: ${{ github.event.pull_request.head.repo.id == github.event.repository.id && github.head_ref == 'develop' }}
        run: |
          if [ "$VALID_SOURCE" != "true" ]; then
            echo "::error::请将功能分支的 PR 提交到 develop。只有本仓库的 develop 可以合入 main。"
            exit 1
          fi

  build:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VitePress 构建遇到死链、Markdown/Vue 模板错误时失败
      - run: npm run build
